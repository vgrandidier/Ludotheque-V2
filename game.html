<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détail du jeu</title>

	<link rel="icon" type="image/png" href="images/favicon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Dancing+Script&family=Pacifico&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Chango&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rubik+Dirt&display=swap" rel="stylesheet">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
        
      /* ✅ Popup image */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        padding-top: 60px;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.9);
      }

      .modal img {
        margin: auto;
        display: block;
        max-width: 90%;
        max-height: 80%;
      }

      .close, .prev, .next {
        position: absolute;
        color: white;
        font-size: 40px;
        cursor: pointer;
        user-select: none;
      }

      .close { top: 20px; right: 30px; }
      .prev { top: 50%; left: 20px; }
      .next { top: 50%; right: 20px; }

      .gallery img {
        max-width: 150px;
        margin: 10px;
        cursor: pointer;
        border-radius: 5px;
      }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <!-- TITRE -->
  <div class="game-title" id="title"></div>


  <!-- GALERIE -->
  <div class="gallery" id="gallery"></div>

  <!-- POPUP -->
  <div id="modal" class="modal">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <span class="next">&#10095;</span>
    <img id="modal-img">
  </div>


  <!-- INFOS -->
  <div class="game-info">

    <!-- DESCRIPTION -->
    <h3>Les Règles</h3>
    <p id="rules"></p>

    <h3>Le Matériel</h3>
    <p id="material"></p>

    <h3>Les Conditions de Victoire</h3>
    <p id="victory"></p>

    <h3>Les Récompenses</h3>
    <ul id="rewards"></ul>

    <br>

    <!-- CARACTERISTIQUES -->
    <div class="game-details">

      <div class="detail">
        <i class="material-icons">face</i>
        <span id="age"></span>
      </div>

      <div class="detail">
        <i class="material-icons">people</i>
        <span id="players"></span>
      </div>

      <div class="detail-no-border">
        <i class="material-icons">timer</i>
        <span id="duration"></span>
      </div>

    </div>

    <!-- PRIX / VENDEURS -->
    <div class="price-list" id="price-list"></div>

    <p class="price-date">
      Prix constatés le <b id="price-date"></b>
    </p>
    
    <!-- ✅ VIDEO YOUTUBE -->
    <div class="video-container" style="margin-top:30px;">
      <iframe id="youtube"
        width="100%" height="400"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>
    <br>

    <!-- RETOUR -->

    <div class="back-button">
      <a id="back-link" href="index.html">Retour à la liste</a>
    </div>


  </div>

</div>


<script>

const BASE_URL = "https://ludotheque-backend.onrender.com";

// ==========================
// 1. RECUP ID URL
// ==========================

const params = new URLSearchParams(window.location.search);
const gameId = params.get('id');

let images = [];
let currentImageIndex = 0;

// enlever l'id du jeu
params.delete("id");

// reconstruire le lien retour avec les filtres
const backLink = document.getElementById("back-link");

backLink.href = "index.html" + (
  params.toString() ? "?" + params.toString() : ""
);

// ==========================
// 2. CHARGER JSON
// ==========================

fetch(`${BASE_URL}/games`)
  .then(res => res.json())
  .then(games => {

    const game = games.find(g => g.id === gameId);

    if (!game) {
      document.body.innerHTML = "Jeu introuvable";
      return;
    }

    // =====================
    // GALERIE
    // =====================

    const gallery = document.getElementById('gallery');
    images = game.images || [];
    
    if (images.length === 0) {
      gallery.innerHTML = "<p>Aucune image disponible</p>";
    }

    images.forEach((src, index) => {
      const img = document.createElement('img');
      img.src = `${BASE_URL}/${src}`;

      img.addEventListener('click', () => openModal(index));

      gallery.appendChild(img);
    });

    // ==========================
    // 3. REMPLISSAGE
    // ==========================

    document.title = game.title;

    document.getElementById('title').innerText = game.title;

    document.getElementById('rules').innerText = game.details?.rules || "";
    document.getElementById('material').innerText = game.details?.material || "";
    document.getElementById('victory').innerText = game.details?.victory || "";

    // ==========================
    // 4. RECOMPENSES
    // ==========================

    const rewardsList = document.getElementById('rewards');
    (game.details?.rewards || []).forEach(r => {
      const li = document.createElement('li');
      li.innerText = r;
      rewardsList.appendChild(li);
    });

    // ==========================
    // 5. DETAILS
    // ==========================

    document.getElementById('age').innerHTML =
      `à partir de<br><b>${game.age} ans</b>`;

    document.getElementById('players').innerHTML =
      `<b>${game.players}</b><br>joueurs`;

    document.getElementById('duration').innerHTML =
      `<b>${game.duration}</b><br>minutes`;

    document.getElementById('back-link').href =
      `index.html?focus=${gameId}`;

    // ==========================
    // ✅ 6. VENDEURS (VERSION PRO)
    // ==========================

    const priceContainer = document.getElementById('price-list');

    (game.prices || []).forEach(p => {

      const isBest = p.best === true;

      const item = document.createElement('div');
      item.className = 'price-item';

      item.innerHTML = `
        <span class="vendor ${p.type || 'default'}">${p.vendor}</span>
        <span class="${isBest ? 'best-price' : 'price'}">
          <a href="${p.url}" target="_blank">${p.price}</a>
        </span>
      `;

      priceContainer.appendChild(item);
    });

    // ==========================
    // 7. DATE
    // ==========================

    //const today = new Date();
    const today = new Date(game['pricesdate'] || Date.now());
    const formattedDate = today.toLocaleDateString('fr-FR');

    document.getElementById('price-date').innerText = formattedDate;

    // =====================
    // ✅ VIDEO
    // =====================
    if (game.youtube) {
      document.getElementById('youtube').src = game.youtube;
    } else {
      document.querySelector('.video-container').style.display = "none";
    }

  });

  // =====================
  // MODAL GALERIE
  // =====================

  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');

  function openModal(index) {
    currentImageIndex = index;
    modal.style.display = "block";
    modalImg.src = `${BASE_URL}/${images[index]}`;
  }

  function closeModal() {
    modal.style.display = "none";
  }

  // boutons
  document.querySelector('.close').onclick = closeModal;

  document.querySelector('.prev').onclick = () => {
    currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
    modalImg.src = `${BASE_URL}/${images[currentImageIndex]}`;
  };

  document.querySelector('.next').onclick = () => {
    currentImageIndex = (currentImageIndex + 1) % images.length;
    modalImg.src = `${BASE_URL}/${images[currentImageIndex]}`;
  };

  // clic extérieur
  modal.onclick = e => {
    if (e.target === modal) closeModal();
  };

</script>

</body>
</html>
